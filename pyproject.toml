[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-cli"
version = "0.1.0"
description = "A Spotify Web API CLI that can control a Windows Spotify client from WSL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spotifycli = "main:main"

[tool.setuptools]
py-modules = ["main"]
